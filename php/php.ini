; Copia de php.ini con extensiones habilitadas para sqlite e intl
; Basado en php.ini-production

; ...existing code...

[PHP]
extension_dir = "ext"


; Habilitar SQLite
extension=sqlite3
extension=pdo_sqlite
extension=gd
; Habilitar soporte SQLite en DBA (opcional, solo si tu app lo requiere)
extension=dba
; Handler para dba con sqlite3 (opcional)
;dba.default_handler=sqlite3

; Habilitar intl
extension=intl
extension=openssl

; Las rutas de CA se inyectan en runtime desde iniciar_servidor.vbs con -d
; (openssl.cafile y curl.cainfo), para que funcionen sin depender de C:\printerapp\...
;[openssl]
;openssl.cafile="C:\printerapp\ID-Print-free-main\ID-Print-free-main\php\cert\cacert.pem"

;[curl]
;curl.cainfo="C:\printerapp\ID-Print-free-main\ID-Print-free-main\php\cert\cacert.pem"


